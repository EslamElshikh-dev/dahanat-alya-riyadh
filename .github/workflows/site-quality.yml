name: Site quality checks

on:
  push:
    branches: [main, 'codex/security-next-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Prepare verified product-image model
        run: node scripts/prepare-product-model.mjs
      - name: Test admin permissions, sessions, images and contact tracking
        run: node --experimental-test-module-mocks --conditions=react-server --import tsx --test tests/*.test.ts
        env:
          NODE_ENV: production
      - name: Generate route types and check TypeScript
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      # The full production build runs on Vercel with its private catalog store.
      # This workflow deliberately has no production credentials or data access.
